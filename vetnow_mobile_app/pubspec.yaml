name: vetnow_mobile
description: VetNow — mobile companion app for the VetNow booking platform.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  # Uncomment once font files are added under assets/fonts/
  # (see assets/fonts/README.md) to match the Angular app's
  # Italiana (display) + Inter (body) typography.
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: Italiana
  #     fonts:
  #       - asset: assets/fonts/Italiana-Regular.ttf

