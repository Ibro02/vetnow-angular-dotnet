# Static analysis for the VetNow mobile app.
#
# The rules added below flutter_lints are deliberately the ones that
# catch *bugs*, not the ones that enforce a house style. Style lints
# produce a wall of findings that everyone learns to scroll past, and the
# real one is then in the middle of it.
#
# Suppress a rule for one line with `// ignore: name_of_lint`, or for a
# file with `// ignore_for_file: name_of_lint`, rather than turning it
# off for the whole project.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # A forgotten await is the single most common way async code in this
    # app goes wrong — a request fires, nothing waits for it, and the
    # failure surfaces later somewhere unrelated. Treated as a warning so
    # it cannot be scrolled past.
    unawaited_futures: warning
    # Using a BuildContext after an await, when the widget may already be
    # gone. Causes a crash in release and nothing in debug.
    use_build_context_synchronously: warning

  exclude:
    # Generated from the .arb files; regenerating overwrites any edit.
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    # ── Async correctness ────────────────────────────────────────────
    - unawaited_futures
    - avoid_slow_async_io
    # discarded_futures is deliberately NOT enabled. It fires on every
    # intentional fire-and-forget and on most test setup — 39 findings
    # against unawaited_futures' 12, almost all of them fine. A rule
    # that is usually wrong teaches people to ignore the list it is in.

    # ── Resources that leak if not released ──────────────────────────
    - cancel_subscriptions
    - close_sinks

    # ── Things that fail at runtime rather than at compile time ──────
    #
    # The API layer decodes to dynamic, so every field read off a
    # response is unchecked. This does not forbid that — it makes each
    # place visible, which is where the defensive parsing belongs.
    - avoid_dynamic_calls
    - avoid_type_to_string
    - only_throw_errors
    - throw_in_finally
    - no_adjacent_strings_in_list

    # ── Correctness of equality and collections ──────────────────────
    - avoid_equals_and_hash_code_on_mutable_classes
    - collection_methods_unrelated_type

    # ── Ships to a user's phone ──────────────────────────────────────
    #
    # print() writes to logcat on a real device, where it is both noise
    # and a way to leak whatever was being debugged. debugPrint and the
    # crash log are the ways to say something.
    - avoid_print

    # ── Readability where it prevents mistakes ───────────────────────
    - always_declare_return_types
    - prefer_final_locals
    - unnecessary_await_in_return
    - unnecessary_null_checks
