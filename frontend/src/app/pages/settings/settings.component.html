<app-header-title description="Which settings do you want to manage?" title="Settings"/>
<div class="flex flex-col items-center w-full gap-12 mt-8 pb-12">
    <div>
        <h3 class="text-gray-500 text-sm font-semibold font-body uppercase tracking-wide mb-3">Profile settings</h3>
        <app-settings-card [array]="accountSettingsArr"></app-settings-card>
    </div>

    <!-- Workspace settings: MainVet+ only -->
    <div *ngIf="auth.isAtLeastMainVet()">
        <h3 class="text-gray-500 text-sm font-semibold font-body uppercase tracking-wide mb-3">Workspace settings</h3>
        <app-settings-card [array]="workspaceSettingsArr"></app-settings-card>
    </div>

    <!-- Employee extras -->
    <div *ngIf="auth.isAtLeastEmployee()">
        <h3 class="text-gray-500 text-sm font-semibold font-body uppercase tracking-wide mb-3">Employee</h3>
        <app-settings-card [array]="employeeExtrasArr"></app-settings-card>
    </div>

    <!-- Admin section -->
    <div *ngIf="auth.isAdminUser()">
        <h3 class="text-gray-500 text-sm font-semibold font-body uppercase tracking-wide mb-3">Administration</h3>
        <app-settings-card [array]="adminSettingsArr"></app-settings-card>
    </div>
</div>
