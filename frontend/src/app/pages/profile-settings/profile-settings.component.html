
<div id="background">
  <app-header-title
    [title]="i18n.t('pageTitle')"
    [description]="i18n.t('pageDescription')"
  >{{ i18n.t('pageTitle') }}</app-header-title>

  <div class="bg-white flex flex-col w-4/5 m-auto justify-evenly items-center gap-3 border-1 rounded-lg relative">

      <!-- ── Language toggle button ── -->
      <button
        (click)="i18n.toggle()"
        [title]="i18n.t('switchLang')"
        class="absolute top-4 right-4 flex items-center gap-1.5 px-3 py-1.5
               rounded-full border border-gray-200 bg-white shadow-sm
               text-xs font-semibold text-gray-600
               hover:border-emerald-400 hover:text-emerald-600
               transition-all duration-200 select-none z-10">

        <!-- Globe icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10
                   15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>

        <!-- Show the OTHER language as the action (click to switch to it) -->
        <span>{{ i18n.currentLang === 'en' ? '🇧🇦 BS' : '🇬🇧 EN' }}</span>
      </button>

      <div class="flex flex-col w-2/3">
        <form class="md:grid grid-cols-2 gap-8">

          <!-- Left column -->
          <div>
            <app-input
              type="text"
              [label]="i18n.t('firstName')"
              [placeholder]="i18n.t('firstNamePlaceholder')"
              [formControl]="profileSettingsFormGroup.controls.firstName"
              [value]="profileSettingsFormGroup.value.firstName?.toString()"
              name="fieldName"
              ngDefaultControl
            ></app-input>

            <app-input
              type="text"
              [label]="i18n.t('lastName')"
              [placeholder]="i18n.t('lastNamePlaceholder')"
              [formControl]="profileSettingsFormGroup.controls.lastName"
              [value]="profileSettingsFormGroup.value.lastName?.toString()"
              name="fieldName"
              ngDefaultControl
            ></app-input>

            <app-input
              type="text"
              [label]="i18n.t('phone')"
              [placeholder]="i18n.t('phonePlaceholder')"
              [formControl]="profileSettingsFormGroup.controls.phone"
              [value]="profileSettingsFormGroup.value.phone?.toString()"
              name="fieldName"
              ngDefaultControl
            ></app-input>

            <app-input
              type="text"
              [label]="i18n.t('address')"
              [placeholder]="i18n.t('addressPlaceholder')"
              [formControl]="profileSettingsFormGroup.controls.address"
              [value]="profileSettingsFormGroup.value.address?.toString()"
              name="fieldName"
              ngDefaultControl
            ></app-input>

            <app-input
              type="text"
              [label]="i18n.t('city')"
              [placeholder]="i18n.t('cityPlaceholder')"
              [formControl]="profileSettingsFormGroup.controls.city"
              [value]="profileSettingsFormGroup.value.city?.toString()"
              name="fieldName"
              ngDefaultControl
            ></app-input>

            <app-input
              type="text"
              [label]="i18n.t('country')"
              [placeholder]="i18n.t('countryPlaceholder')"
              [formControl]="profileSettingsFormGroup.controls.country"
              [value]="profileSettingsFormGroup.value.country?.toString()"
              name="fieldName"
              ngDefaultControl
            ></app-input>
          </div>

          <!-- Right column -->
          <div>
            <!-- Profile Image -->
            <p class="text-sm text-black text-lg font-normal font-body mb-1">
              {{ i18n.t('profileImage') }}
            </p>
            <div class="flex flex-col items-start gap-2 mb-4">
              <div class="cursor-pointer" (click)="openCropWizard()">
                <div class="w-28 h-28 rounded-full border-1 border-black overflow-hidden bg-gray-200 flex items-center justify-center">
                  <img *ngIf="previewUrl" [src]="previewUrl" alt="Profile" class="w-full h-full object-cover"/>
                  <fa-icon *ngIf="!previewUrl" [icon]="faUser" class="text-4xl text-gray-400"></fa-icon>
                </div>
              </div>
              <input
                id="fileInput"
                type="file"
                accept="image/*"
                class="hidden"
                (change)="onFileSelected($event)"
              />
            </div>

            <!-- Crop & Rotate Wizard Modal -->
            <div *ngIf="showCropWizard" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-25">
              <div class="bg-white rounded-xl shadow-2xl w-[480px] flex flex-col overflow-hidden">

                <!-- Header -->
                <div class="px-6 py-4 border-b border-gray-200">
                  <h2 class="text-lg font-semibold text-gray-800">{{ i18n.t('cropImage') }}</h2>
                </div>

                <!-- Crop area -->
                <div class="relative bg-gray-100 flex items-center justify-center" style="height: 360px;">
                  <div
                    #cropArea
                    class="crop-area relative overflow-hidden w-full h-full cursor-grab active:cursor-grabbing"
                    (mousedown)="onPanStart($event)"
                    (wheel)="onZoomWheel($event)"
                  >
                    <img
                      #cropImage
                      *ngIf="cropImageSrc"
                      [src]="cropImageSrc"
                      alt="Crop preview"
                      class="absolute select-none pointer-events-none"
                      [style.transform]="'translate(' + cropOffsetX + 'px, ' + cropOffsetY + 'px) scale(' + cropZoom + ')'"
                      [style.transform-origin]="'center center'"
                      draggable="false"
                    />
                    <!-- Circular overlay mask -->
                    <div class="crop-overlay absolute inset-0 pointer-events-none"></div>
                  </div>
                </div>

                <!-- Zoom slider -->
                <div class="px-6 py-3 flex items-center gap-3 border-t border-gray-100">
                  <span class="text-xs text-gray-500">-</span>
                  <input
                    type="range"
                    min="0.5"
                    max="3"
                    step="0.05"
                    [value]="cropZoom"
                    (input)="onZoomSlider($event)"
                    class="flex-1 accent-emerald-500"
                  />
                  <span class="text-xs text-gray-500">+</span>
                </div>

                <!-- Footer with Cancel / Save -->
                <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
                  <app-button type="secondary" [text]="i18n.t('cancel')" (event)="closeCropWizard()"></app-button>
                  <app-button type="primary"   [text]="i18n.t('save')"   (event)="saveCroppedImage()"></app-button>
                </div>

              </div>
            </div>

            <app-input
              type="text"
              [label]="i18n.t('email')"
              [placeholder]="i18n.t('emailPlaceholder')"
              [formControl]="profileSettingsFormGroup.controls.email"
              [value]="profileSettingsFormGroup.value.email?.toString()"
              name="fieldName"
              ngDefaultControl
            ></app-input>

            <app-input
              type="text"
              [label]="i18n.t('username')"
              [placeholder]="i18n.t('usernamePlaceholder')"
              [formControl]="profileSettingsFormGroup.controls.username"
              [value]="profileSettingsFormGroup.value.username?.toString()"
              name="fieldName"
              ngDefaultControl
            ></app-input>

            <app-input
              type="text"
              [label]="i18n.t('password')"
              [placeholder]="i18n.t('passwordPlaceholder')"
              [formControl]="profileSettingsFormGroup.controls.password"
              [value]="profileSettingsFormGroup.value.password?.toString()"
              name="fieldName"
              ngDefaultControl
            ></app-input>
          </div>

          <!-- Leaflet Map - full width below both columns -->
          <div class="col-span-2 w-1/2" [style.visibility]="showCropWizard ? 'hidden' : 'visible'">
            <p class="text-sm text-black text-lg font-normal font-body mb-1">
              {{ i18n.t('pickLocation') }}
            </p>
            <div #mapContainer class="w-full h-64 rounded-md overflow-hidden border border-gray-200 shadow-sm"></div>
          </div>

        </form>
      </div>

      <div class="align-middle">
        <app-button type="secondary" [text]="i18n.t('cancel')" (click)="navigateToSettings()"></app-button>
        <app-button type="primary"   [text]="i18n.t('save')"   (event)="saveChanges()"></app-button>
      </div>

  </div>
</div>
