<div class="mt-20 flex">
  <div class="verification-box justify-center items-center h-auto m-auto">
    <app-title>Enter a verification code</app-title>
    <p class="text-center text-gray-500">You should receive a verification code at your email address</p>
    <input type="text" class="border-1 border-solid border-black p-1 rounded-1 m-4 text-lg font-bold text-center" [maxLength]="10" [(ngModel)]="token"/>
    <app-button text="Verificate account" (event)="verifyUser()"/>
  </div>
</div>
