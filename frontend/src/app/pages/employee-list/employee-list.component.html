<app-header-title title="Employees" description="List of employees" />

<app-add-employee *ngIf="showAddEmployee" (event)="ngOnInit(); showAddEmployee = false" />

<app-table
  title="Employees"
  [columns]="columns"
  [data]="employees"
  addButtonText="Add Employee"
  (addClick)="showAddEmployee = true"
  (actionClick)="onAction($event)"
/>
