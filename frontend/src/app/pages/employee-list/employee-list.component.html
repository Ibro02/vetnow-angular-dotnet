<app-header-title title="Employees" description="List of employees" />

<app-add-employee *ngIf="showAddEmployee" [editEmployee]="editingEmployee" (event)="ngOnInit(); showAddEmployee = false; editingEmployee = null" />

<app-table
  title="Employees"
  [columns]="columns"
  [data]="employees"
  [actions]="actions"
  [addButtonText]="addBtnText"
  (addClick)="editingEmployee = null; showAddEmployee = true"
  (actionClick)="onAction($event)"
/>

<!-- Delete confirmation modal -->
<app-confirm-modal
  [visible]="showDeleteConfirm"
  title="Delete Employee"
  [message]="'Are you sure you want to delete ' + (deleteTargetEmployee?.firstName ?? '') + ' ' + (deleteTargetEmployee?.lastName ?? '') + '? This action cannot be undone.'"
  confirmText="Delete"
  cancelText="Cancel"
  [isDanger]="true"
  (onConfirm)="confirmDeleteEmployee()"
  (onCancel)="cancelDeleteEmployee()"
/>
