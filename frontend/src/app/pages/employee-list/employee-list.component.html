<app-header-title title="Employees" description="List of employees" />

<app-add-employee *ngIf="showAddEmployee" [editEmployee]="editingEmployee" (event)="ngOnInit(); showAddEmployee = false; editingEmployee = null" />

<app-table
  title="Employees"
  [columns]="columns"
  [data]="employees"
  [actions]="actions"
  [addButtonText]="addBtnText"
  (addClick)="editingEmployee = null; showAddEmployee = true"
  (actionClick)="onAction($event)"
/>
