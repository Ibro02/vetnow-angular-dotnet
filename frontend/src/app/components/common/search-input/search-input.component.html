<div class="relative">

  <!-- ── Search Pill ── -->
  <div class="search-pill">

    <!-- Left: Search icon -->
    <span class="search-pill-icon">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>

    <!-- Input -->
    <input
      type="search"
      id="search-dropdown"
      class="search-pill-input"
      placeholder="Search by station name..."
      (change)="searchVetStation"
    />

    <!-- Right: Filters button -->
    <button
      type="button"
      class="filters-btn"
      [class.filters-btn-active]="filterIsClicked"
      (click)="filterIsClicked = !filterIsClicked">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3Z"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Filters</span>
      <span *ngIf="activeFilterCount > 0" class="filter-count-badge">{{ activeFilterCount }}</span>
    </button>

  </div>

  <!-- ── Filter Dropdown ── -->
  <div
    class="dropdown-panel"
    [class.hidden]="!filterIsClicked">

    <ng-container *ngFor="let i of this.vetStationService.dropdown; let last = last">

      <!-- Section title -->
      <p class="dropdown-section-title">{{ i.title }}</p>

      <!-- Filter chips -->
      <div class="dropdown-section-items">
        <ng-container *ngFor="let j of i.children">
          <app-input-button
            (click)="handleChange(j.value, i.key, j.key)"
            content="{{ j.name }}"
            [isChecked]="j.value"
            ngDefaultControl>
          </app-input-button>
        </ng-container>
      </div>

      <!-- Divider (except after last) -->
      <div *ngIf="!last" class="dropdown-divider"></div>

    </ng-container>

  </div>

</div>
