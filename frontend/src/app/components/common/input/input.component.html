<div
  class="flex {{ type !== 'checkbox' ? 'flex-col' : 'flex-row-reverse justify-self-start items-center' }} gap-1.5 my-2"
>
  <label
    [for]="id"
    class="text-sm text-gray-700 font-medium"
  >
    {{ label }}
  </label>

  <ng-container [ngSwitch]="type">

    <!-- TEXT INPUT -->
    <input
      *ngSwitchCase="'text'"
      type="text"
      [formControl]="formControl"
      [placeholder]="placeholder"
      [id]="id"
      [name]="name"
      [(ngModel)]="value"
      ngDefaultControl
      class="w-full h-10 rounded-lg border border-gray-300 px-3 text-sm
             focus:outline-none focus:ring-2 focus:ring-emerald-400
             focus:border-emerald-400 transition"
    />

    <!-- FILE INPUT -->
    <input
      *ngSwitchCase="'file'"
      type="file"
      accept="image/png, image/gif, image/jpeg"
      [formControl]="formControl"
      [id]="id"
      [name]="name"
      (change)="onFileSelected($event)"
      ngDefaultControl
      class="w-full text-sm file:mr-4 file:py-2 file:px-4
             file:rounded-lg file:border-0
             file:bg-emerald-500 file:text-white
             hover:file:bg-emerald-600 transition"
    />

    <!-- TEXTAREA -->
    <textarea
      *ngSwitchCase="'description'"
      [placeholder]="placeholder"
      [formControl]="formControl"
      [name]="name"
      [id]="id"
      [(ngModel)]="value"
      rows="4"
      ngDefaultControl
      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
             focus:outline-none focus:ring-2 focus:ring-emerald-400
             focus:border-emerald-400 transition resize-none"
    ></textarea>

    <!-- CHECKBOX -->
    <div class="flex">
      <div class="checkbox-wrapper-31" *ngIf="type === 'checkbox'">
        <input type="checkbox" [formControl]="formControl" [name]="name" [(ngModel)]="value" ngDefaultControl />
        <svg viewBox="0 0 35.6 35.6">
          <circle class="background" cx="17.8" cy="17.8" r="17.8"> </circle>
          <circle class="stroke" cx="17.8" cy="17.8" r="14.37"></circle>
          <polyline class="check" points="11.78 18.12 15.55 22.23 25.17 12.87" ></polyline>
        </svg>
      </div>
    </div>

    <!-- DROPDOWN -->
    <select
      *ngSwitchCase="'dropdown'"
      [formControl]="formControl"
      [(ngModel)]="value"
      ngDefaultControl
      class="w-full h-10 rounded-lg border border-gray-300 px-3 text-sm
             bg-white
             focus:outline-none focus:ring-2 focus:ring-emerald-400
             focus:border-emerald-400 transition"
    >
      <option *ngFor="let i of array" [value]="i.name">
        {{ i.name }}
      </option>
    </select>

  </ng-container>
</div>
