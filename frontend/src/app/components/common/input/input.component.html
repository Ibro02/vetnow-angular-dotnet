<div
  class="flex {{
    type != 'checkbox' ? 'flex-col' : 'flex-row-reverse'
  }} gap-2 my-1"
>
  <label
    [for]="id"
    class="my-auto mr-auto flex text-black text-lg font-normal font-['Inter']"
    >{{ label }}</label
  >
  <div>
    <ng-container [ngSwitch]="type">
      <input
        [formControl]="formControl"
        *ngSwitchCase="'text'"
        type="text"
        [placeholder]="placeholder"
        [id]="id"
        [name]="name"
        [(ngModel)]="value"
        class="w-full h-9 bg-white rounded-xl border border-black border-opacity-50 text-xl px-1"
        ngDefaultControl
      />
      <input
        *ngSwitchCase="'file'"
        type="file"
        accept="image/png, image/gif, image/jpeg"
        [formControl]="formControl"
        [id]="id"
        [name]="name"
        (change)="onFileSelected($event)"
        class="w-full border-1 border-black rounded-xl h-9 border-opacity-50 flex"
        ngDefaultControl
      />

      <textarea
        *ngSwitchCase="'description'"
        placeholder="{{ placeholder }}"
        [formControl]="formControl"
        [name]="[name]"
        [id]="id"
        [(ngModel)]="value"
        cols="30"
        rows="10"
        class="h-40 w-full border-1 border-black rounded-xl border-opacity-50 p-1 flex"
        ngDefaultControl
      ></textarea>

      <div class="flex">
        <div class="checkbox-wrapper-31" *ngIf="type === 'checkbox'">
          <input
            type="checkbox"
            [formControl]="formControl"
            [name]="name"
            [(ngModel)]="value"
            ngDefaultControl
          />
          <svg viewBox="0 0 35.6 35.6">
            <circle class="background" cx="17.8" cy="17.8" r="17.8"></circle>
            <circle class="stroke" cx="17.8" cy="17.8" r="14.37"></circle>
            <polyline
              class="check"
              points="11.78 18.12 15.55 22.23 25.17 12.87"
            ></polyline>
          </svg>
        </div>
      </div>

      <select
        class="w-full h-9 bg-white rounded-xl border border-black border-opacity-50 text-xl px-1"
        (click)="test()"
        [formControl]="formControl"
        [(ngModel)]="value"
        *ngSwitchCase="'dropdown'"
        ngDefaultControl
      >
        <option *ngFor="let i of array" [value]="i.name" ngDefaultControl>
          {{ i.name }}
        </option>
      </select>
    </ng-container>
  </div>
</div>
