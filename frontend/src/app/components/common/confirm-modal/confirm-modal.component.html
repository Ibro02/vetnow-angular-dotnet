<div *ngIf="visible" class="confirm-overlay" (click)="onOverlayClick($event)">
  <div class="confirm-card" @scaleIn>
    <!-- Icon -->
    <div class="confirm-icon" [class.confirm-icon-danger]="isDanger" [class.confirm-icon-warning]="!isDanger">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>

    <!-- Content -->
    <h3 class="confirm-title">{{ title }}</h3>
    <p class="confirm-message">{{ message }}</p>

    <!-- Actions -->
    <div class="confirm-actions">
      <button class="btn-cancel" (click)="cancel()">{{ cancelText }}</button>
      <button class="btn-confirm"
              [class.btn-confirm-danger]="isDanger"
              [class.btn-confirm-warning]="!isDanger"
              (click)="confirm()">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
