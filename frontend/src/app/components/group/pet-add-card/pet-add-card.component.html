


<div *ngIf="visible" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">

  <div class="bg-white rounded-3xl shadow-xl w-full max-w-2xl overflow-hidden relative">

    <!-- Header -->
    <div class="flex justify-between items-center px-8 py-6">
      <h2 class="text-2xl font-bold text-gray-800 w-full text-center">
        {{ isEditMode ? 'Edit Pet' : 'Add New Pet' }}
      </h2>
      <button (click)="cancel()" class="absolute top-6 right-8 text-gray-400 hover:text-gray-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Form body -->
    <div class="px-10 pb-10 flex flex-col md:flex-row gap-10">

      <!-- Left side: inputs -->
      <div class="flex-1 space-y-4">

        <!-- Name -->
        <div>
          <label class="block text-gray-700 font-medium mb-1 ml-1 text-sm">Name</label>
          <input type="text"
                 [(ngModel)]="petName"
                 placeholder="Enter pet name"
                 class="w-full h-10 rounded-lg border border-gray-300 px-3 text-sm
                        focus:outline-none focus:ring-2 focus:ring-emerald-400
                        focus:border-emerald-400 transition" />
        </div>

        <!-- Species dropdown -->
        <div>
          <label class="block text-gray-700 font-medium mb-1 ml-1 text-sm">Select species</label>
          <select (change)="onSpeciesChange($event)"
                  class="w-full h-10 rounded-lg border border-gray-300 px-3 text-sm bg-white
                         focus:outline-none focus:ring-2 focus:ring-emerald-400
                         focus:border-emerald-400 transition">
            <option value="">-- Select species --</option>
            <option *ngFor="let sp of speciesList"
                    [value]="sp.id"
                    [selected]="selectedSpeciesId === sp.id">
              {{ sp.name }}
            </option>
          </select>
        </div>

        <!-- Breed dropdown -->
        <div>
          <label class="block text-gray-700 font-medium mb-1 ml-1 text-sm">Select breed</label>
          <select (change)="onBreedChange($event)"
                  [disabled]="!selectedSpeciesId"
                  class="w-full h-10 rounded-lg border border-gray-300 px-3 text-sm bg-white
                         focus:outline-none focus:ring-2 focus:ring-emerald-400
                         focus:border-emerald-400 transition
                         disabled:bg-gray-100 disabled:cursor-not-allowed">
            <option value="">-- Select breed --</option>
            <option *ngFor="let br of breedList"
                    [value]="br.id"
                    [selected]="selectedBreedId === br.id">
              {{ br.name }}
            </option>
          </select>
        </div>

        <!-- Birth Date -->
        <div>
          <label class="block text-gray-700 font-medium mb-1 ml-1 text-sm">Birth Date</label>
          <input type="date"
                 [(ngModel)]="birthDate"
                 class="w-full h-10 rounded-lg border border-gray-300 px-3 text-sm
                        focus:outline-none focus:ring-2 focus:ring-emerald-400
                        focus:border-emerald-400 transition" />
        </div>
      </div>

      <!-- Right side: photo area -->
      <div class="flex flex-col items-center justify-center space-y-4 pt-6">

        <!-- Photo preview circle -->
        <div class="w-48 h-48 rounded-full bg-gray-200 border border-gray-300 flex items-center justify-center overflow-hidden relative group"
             (dragover)="onDragOver($event)"
             (dragleave)="onDragLeave($event)"
             (drop)="onFileDrop($event)"

        >
          <!-- Show uploaded/existing image -->
          <img *ngIf="pictureBase64"
               [src]="pictureBase64"
               alt="Pet photo"
               class="w-full h-full object-cover" />

          <!-- Default paw icon when no photo -->
          <svg *ngIf="!pictureBase64"
               xmlns="http://www.w3.org/2000/svg" width="80" height="80"
               viewBox="0 0 24 24" fill="none"
               [attr.stroke]="pawColor"
               stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 4.18-2.84 6.32 1.5 2.76.6 6.38-1.58 7.68-2.2 1.3-5.8-.6-7.3-3.36-1.5 2.76-5.1 4.66-7.3 3.36-2.18-1.3-3.08-4.92-1.58-7.68-2.42-2.14-4.24-5.74-2.84-6.32 1.39-.58 4.64.26 6.42 2.26.65-.17 1.33-.26 2-.26z"></path>
          </svg>

          <!-- Remove photo overlay (shown on hover when photo exists) -->
          <div *ngIf="pictureBase64"
               (click)="removePhoto()"
               class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                 stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </div>
        </div>

        <!-- Hidden file input -->
        <input type="file"
               id="pet-photo-input"
               accept="image/png, image/gif, image/jpeg"
               (change)="onFileSelected($event)"
               class="hidden" />

        <!-- Choose image button -->
        <button (click)="triggerFileInput()"
                class="bg-[#2D1F5D] text-white px-5 py-2 rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-opacity-90 transition-all shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          Choose image
        </button>
      </div>
    </div>

    <!-- Footer buttons -->
    <div class="flex justify-end gap-4 px-10 pb-8">
      <app-button type="secondary" text="Cancel" (event)="cancel()"></app-button>
      <app-button type="primary" text="Save" (event)="save()"></app-button>
    </div>

  </div>
</div>
